<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>מסלול מקראי במוזיאון הבריטי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#e9e4d8">
<script>document.documentElement.lang="he";document.documentElement.dir="rtl";document.documentElement.dataset.theme="light";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: one column, sticky glass header, map card, route list, floating "next" capsule, glass bottom sheet per stop.
   Palette from the Standard of Ur: lapis, shell, carnelian, gold over limestone. */
:root{
  --bg:#ebe6db; --bg2:#ddd6c6;
  --ink:#1d2333; --ink2:#454c60; --ink3:#5c6276;
  --lapis:#2445a3; --lapis-soft:rgba(36,69,163,.12);
  --carnelian:#a83d22; --gold:#85600f; --ok:#1f7a4d; --ok-soft:rgba(31,122,77,.13); --warn-soft:rgba(185,71,42,.13);
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --glass-edge:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.95); --shadow:rgba(40,45,70,.16); --line:rgba(29,35,51,.10);
  --room:#cfc6b3; --room-ctx:rgba(29,35,51,.07); --court:rgba(255,255,255,.45);
  --blob1:rgba(36,69,163,.38); --blob2:rgba(185,71,42,.30); --blob3:rgba(169,123,28,.30);
  --map-filter:none; --ov-fill:rgba(242,184,48,.42); --ov-stroke:#f2b830;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-display:"Frank Ruhl Libre","Times New Roman",serif;
  --r-lg:26px; --r-md:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1426; --bg2:#151c33; --ink:#eef0f6; --ink2:#c3c8d8; --ink3:#a0a7bd;
  --lapis:#8aa6ff; --lapis-soft:rgba(138,166,255,.16); --carnelian:#ff8a6a; --gold:#e3b75a; --ok:#5fd39a; --ok-soft:rgba(95,211,154,.15); --warn-soft:rgba(255,138,106,.16);
  --glass:rgba(32,40,68,.48); --glass-strong:rgba(30,37,62,.82); --glass-edge:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.22);
  --shadow:rgba(0,0,0,.45); --line:rgba(255,255,255,.10); --room:#3a4566; --room-ctx:rgba(255,255,255,.06); --court:rgba(255,255,255,.05);
  --blob1:rgba(70,100,220,.45); --blob2:rgba(200,80,50,.28); --blob3:rgba(200,150,50,.22); --map-filter:invert(.9) hue-rotate(180deg); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1426; --bg2:#151c33; --ink:#eef0f6; --ink2:#c3c8d8; --ink3:#a0a7bd;
  --lapis:#8aa6ff; --lapis-soft:rgba(138,166,255,.16); --carnelian:#ff8a6a; --gold:#e3b75a; --ok:#5fd39a; --ok-soft:rgba(95,211,154,.15); --warn-soft:rgba(255,138,106,.16);
  --glass:rgba(32,40,68,.48); --glass-strong:rgba(30,37,62,.82); --glass-edge:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.22);
  --shadow:rgba(0,0,0,.45); --line:rgba(255,255,255,.10); --room:#3a4566; --room-ctx:rgba(255,255,255,.06); --court:rgba(255,255,255,.05);
  --blob1:rgba(70,100,220,.45); --blob2:rgba(200,80,50,.28); --blob3:rgba(200,150,50,.22); --map-filter:invert(.9) hue-rotate(180deg); color-scheme:dark}

*{box-sizing:border-box}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40vmax 40vmax at 85% 8%,var(--blob1),transparent 70%),
             radial-gradient(35vmax 35vmax at 5% 45%,var(--blob2),transparent 70%),
             radial-gradient(38vmax 38vmax at 70% 95%,var(--blob3),transparent 70%),
             linear-gradient(180deg,var(--bg),var(--bg2))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass-strong)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--lapis)}
:focus-visible{outline:3px solid var(--lapis);outline-offset:2px;border-radius:10px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px -8px var(--shadow)}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;display:flex;flex-direction:column;gap:14px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;border-radius:0 0 22px 22px;border-top:0}
.top .t{flex:1;min-width:0}
.top h1{margin:0;font-family:var(--f-display);font-size:1.25rem;line-height:1.15;font-weight:700;text-wrap:balance}
.top .sub{font-size:.82rem;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

.seg{display:flex;padding:4px;border-radius:999px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--ink2);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 10px -2px var(--shadow),inset 0 1px 0 var(--glass-hi)}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.controls .seg{flex:1 1 200px;min-width:0}

.alert{border-radius:var(--r-md);padding:10px 14px;display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.alert svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--carnelian)}

.mapcard{border-radius:var(--r-lg);padding:10px;position:relative;overflow:hidden}
.mapcard svg.map{width:100%;height:auto;display:block;direction:ltr;touch-action:manipulation}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--ink2);padding:4px 6px 2px}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.room-ctx{fill:var(--room-ctx)}
.seg.mini button{min-height:34px;font-size:.85rem}
.realmap{filter:var(--map-filter)}
.room-stop.ov{fill:var(--ov-fill);stroke:var(--ov-stroke);stroke-width:3}
.room-stop.ov.done{fill:rgba(31,160,90,.38);stroke:#2bb673}
.room-stop.ov:hover{fill:var(--ov-fill)}
.room-stop{fill:var(--lapis-soft);stroke:var(--lapis);stroke-width:1.6;cursor:pointer;transition:fill .2s}
.room-stop.done{fill:var(--ok-soft);stroke:var(--ok)}
.room-stop.closed{stroke-dasharray:4 3}
.room-stop:hover{fill:rgba(36,69,163,.22)}
.rnum{font:800 16px var(--f-body);fill:var(--ink2);pointer-events:none;text-anchor:middle;dominant-baseline:central}
.rlab{font:600 11px var(--f-body);fill:var(--ink3);pointer-events:none;text-anchor:middle}
.route{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 7;opacity:.95}
.pin circle{fill:var(--gold);stroke:var(--glass-hi);stroke-width:2}
.pin.done circle{fill:var(--ok)}
.pin.next circle{fill:var(--carnelian)}
.pin text{font:800 14px var(--f-body);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin{cursor:pointer}
.mapbtns{display:flex;gap:8px;flex-wrap:wrap;padding:6px}

.secttl{display:flex;align-items:center;gap:10px;margin:8px 4px 0;font-weight:700;color:var(--ink2);font-size:.9rem;letter-spacing:.02em}
.secttl::after{content:"";flex:1;height:1px;background:var(--line)}

.list{display:flex;flex-direction:column;gap:10px}
.stop{border-radius:var(--r-md);padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:start;width:100%;min-width:0;overflow:hidden;transition:transform .15s}
.stop:active{transform:scale(.985)}
.num{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.stop.done .num{background:var(--ok)}
.stop.next{outline:2px solid var(--carnelian);outline-offset:-2px}
.stop.next .num{background:var(--carnelian)}
.stop .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.stop .row1{display:flex;gap:6px 8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.stop .room{font-weight:800;font-size:1.02rem}
.stop .name{font-weight:600;color:var(--ink2);min-width:0}
.stop .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.84rem;color:var(--ink3)}
.stop .peek{font-size:.88rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{flex:none;font-size:.8rem;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;line-height:1.4;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--warn-soft);color:var(--carnelian)}
.chip.info{background:var(--lapis-soft);color:var(--lapis)}
.chip.star{background:rgba(169,123,28,.16);color:var(--gold)}
.lunch{border-radius:var(--r-md);padding:10px 14px;display:flex;gap:12px;align-items:center;color:var(--ink2);font-size:.92rem;border-style:dashed}
.lunch svg{width:22px;height:22px;flex:none;color:var(--gold)}
.walk{font-size:.84rem;color:var(--ink3);padding:0 18px;display:flex;gap:6px;align-items:center}

.fab{position:fixed;z-index:25;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;padding:0 max(16px,env(safe-area-inset-left,0px))}
.fab button{pointer-events:auto;border-radius:999px;min-height:56px;padding:8px 22px 8px 10px;display:flex;align-items:center;gap:10px;max-width:100%;font-weight:700;background:var(--glass-strong)}
.fab .num{width:40px;height:40px;background:var(--carnelian)}
.fab .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:0}
.fab .txt small{font-weight:600;color:var(--ink3);font-size:.75rem}
.fab .txt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,30,.32);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;inset-inline:0;bottom:0;margin:0 auto;max-width:760px;height:calc(100% - 40px - env(safe-area-inset-top,0px));
  border-radius:30px 30px 0 0;border-bottom:0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);background:var(--glass-strong);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sh-head{display:flex;gap:12px;align-items:flex-start;padding:10px max(18px,env(safe-area-inset-left,0px)) 12px;border-bottom:1px solid var(--line);flex:none}
.sh-head .num{width:44px;height:44px;font-size:1.1rem}
.sh-head .t{flex:1;min-width:0}
.sh-head h2{margin:0;font-family:var(--f-display);font-size:1.45rem;line-height:1.15;text-wrap:balance}
.sh-head .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:.85rem;color:var(--ink2);align-items:center}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px max(16px,env(safe-area-inset-left,0px)) 24px;display:flex;flex-direction:column;gap:12px}
.sh-body>*{flex-shrink:0}
.way{font-size:.92rem;color:var(--ink2);display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--lapis-soft)}
.way svg{width:18px;height:18px;flex:none;margin-top:3px;color:var(--lapis)}
.tabs{position:sticky;top:-14px;z-index:2;margin:-14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--glass-strong);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

.item{border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden;background:var(--glass)}
.item.seen{opacity:.72}
.item .hd{display:flex;gap:10px;align-items:flex-start}
.check{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;margin:-6px;}
.check span{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink3);display:grid;place-items:center;transition:all .2s}
.check svg{width:16px;height:16px;opacity:0;color:#fff}
.check[aria-checked="true"] span{background:var(--ok);border-color:var(--ok)}
.check[aria-checked="true"] svg{opacity:1}
.item h3{margin:0;font-size:1.08rem;line-height:1.3;font-weight:800}
.item .hd .t{flex:1;min-width:0}
.item .sub{font-size:.84rem;color:var(--ink3);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.item p{margin:0;color:var(--ink);font-size:.97rem}
.note{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;padding:8px 10px;border-radius:12px;background:var(--warn-soft);color:var(--ink)}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--carnelian)}
.bible{font-size:.9rem;color:var(--ink2)}
.bible b{color:var(--gold);font-weight:800}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:4px 12px;border-radius:999px;font-size:.86rem;font-weight:700;text-decoration:none;color:var(--lapis);background:var(--lapis-soft);max-width:100%}
.lk svg{width:14px;height:14px;flex:none}
.lk.pri{background:var(--lapis);color:#fff}
:root[data-theme="dark"] .lk.pri{color:#0f1426}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lk.pri{color:#0f1426}}

.item .panel{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;display:flex;flex-direction:column;gap:8px}
.lk.tg{cursor:pointer;border:1.5px solid var(--lapis);background:transparent}
.lk.tg.on{background:var(--lapis);color:#fff}
:root[data-theme="dark"] .lk.tg.on{color:#0f1426}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lk.tg.on{color:#0f1426}}
.lk.tg svg{width:16px;height:16px}
ul.plain,ol.plain{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
p.small{margin:0;font-size:.88rem;color:var(--ink2)}
.item .pods .h4{margin:0}
.pod{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--room-ctx);min-width:0;overflow:hidden}
.pod .hd{display:flex;gap:8px;align-items:flex-start}
.lang{flex:none;font-size:.72rem;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--ink);color:var(--bg);margin-top:3px;letter-spacing:.04em}
.pod .ttl{font-weight:800;min-width:0;line-height:1.35}
.pod .ttl .ep{font-weight:600;color:var(--ink2)}
.pod .m{display:flex;flex-wrap:wrap;gap:6px;font-size:.82rem;color:var(--ink3)}
.pod p{margin:0;font-size:.93rem;color:var(--ink2)}
.more summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--lapis);min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"+";width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--lapis-soft);font-weight:800}
.more[open] summary::before{content:"−"}
.more ul{margin:4px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:.92rem;color:var(--ink)}
.ext{margin:6px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.ext i{color:var(--ink2)}
.elab{gap:8px!important}
.elab li.hdr{list-style:none;margin-inline-start:-20px;margin-top:6px;color:var(--lapis)}
.elab .tm{display:inline-block;direction:ltr;font-variant-numeric:tabular-nums;font-weight:800;font-size:.8rem;padding:1px 7px;border-radius:999px;background:var(--lapis-soft);color:var(--lapis);text-decoration:none;margin-inline-end:4px}
.more .src{font-size:.78rem;color:var(--ink3);margin-top:6px}
.empty{font-size:.9rem;color:var(--ink3);padding:4px 4px}
.h4{font-weight:800;font-size:.95rem;color:var(--ink2);margin:6px 2px 0;display:flex;align-items:center;gap:8px}
.h4 svg{width:18px;height:18px;color:var(--gold)}

.sh-foot{flex:none;display:flex;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sh-foot button{flex:1;min-height:52px;border-radius:999px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px 10px;min-width:0}
.sh-foot button small{font-weight:600;color:var(--ink3);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sh-foot .nx{background:var(--lapis);color:#fff}
.sh-foot .nx small{color:rgba(255,255,255,.8)}
:root[data-theme="dark"] .sh-foot .nx,:root[data-theme="dark"] .sh-foot .nx small{color:#0f1426}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sh-foot .nx,:root:not([data-theme="light"]) .sh-foot .nx small{color:#0f1426}}
.sh-foot button:disabled{opacity:.35}

/* info */
.info h3{font-family:var(--f-display);font-size:1.15rem;margin:8px 0 0}
.info p,.info li{font-size:.95rem;color:var(--ink2)}
.info ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.93rem}
.kv dt{font-weight:800;color:var(--ink)}
.kv dd{margin:0;color:var(--ink2);min-width:0}
.tbl{overflow-x:auto;border-radius:14px;background:var(--glass)}
.tbl table{border-collapse:collapse;font-size:.86rem;min-width:520px;width:100%}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.tbl th{font-weight:800;color:var(--ink2)}
.pref{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-md);cursor:pointer}
.pref .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pref small{color:var(--ink2);font-size:.85rem}
.pref input{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.pref input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.pref input:checked{background:var(--ok)}
.pref input:checked::after{transform:translateX(-20px)}
.foot-note{font-size:.8rem;color:var(--ink3);text-align:center;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app">
  <header class="top glass">
    <div class="t">
      <h1>המוזיאון הבריטי</h1>
      <div class="sub"><span>מסלול מקראי</span><span id="clock"></span></div>

nineveh:{more:[`הלוחות באו מהארמון הדרום-מערבי של סנחריב (704–681 לפנה"ס).`,`הם מראים חציבה והובלה של שוורים מכונפים במשקל של עד 30 טון.`,`לחפש: המלך עומד ב"ריקשה" שגוררים שני משרתים; בסבך הקנים מסתתרים צבאים וחזירת בר עם גוריה.`,`לחפש גם: ספינה פיניקית עם מגינים תלויים על הסיפון.`],msrc:`דף הגלריה ודפי הפריטים`,t:`תבליטי נינוה`,sub:[`חדר 9`,`המאה ה-7 לפנה"ס`],p:`תבליטים מארמון סנחריב בנינוה, העיר שאליה נשלח יונה. הקדמה טובה ללכיש.`,b:`יונה א 2; מל"ב יט 36`,l:[['הגלריה','https://www.britishmuseum.org/collection/galleries/assyria-nineveh'],['BM: הובלת השור המכונף',BM+'W_1851-0902-2'],['Wikipedia',W+'Nineveh']]},

lionhunt:{t:`ציד האריות של אשורבניפל`,sub:[`10a, אזור C`,`645–635 לפנה"ס`],star:'F',p:`שיא האמנות האשורית. אשורבניפל ("אסנפר", לפי הזיהוי המקובל) הוא גם בעל הספרייה שבה נמצא לוח המבול.`,b:`עזרא ד 10`,l:[['BM: לוח מאותה סדרה (ציד צבאים)',BM+'W_1856-0909-48_8'],['Wikipedia',W+'Lion_Hunt_of_Ashurbanipal']]},
khorsabad:{more:[`גובהו 4.42 מ' ומשקלו כ-16 טון. עמד בשער בחומת המצודה בחורסבאד.`,`אחד מזוג שנועד למנוע מהרע להיכנס.`,`הלוחות שמאחוריו הוצבו פעם בטעות בצד, והיום הם במקומם המקורי.`,`לחפש: מאחורי השור, דמות מכונפת עם "קונוס" ודלי, שעומדת למשוח.`],msrc:`דף הפריט במוזיאון`,t:`שוורי חורסבאד של סרגון השני`,sub:[`10c`,`כ-710 לפנה"ס`],p:`שוורים מכונפים מבירת סרגון. סרגון מוזכר בשמו רק בישעיהו כ 1; הוא השלים את כיבוש שומרון.`,b:`ישעיהו כ 1; מל"ב יז 6`,l:[['BM: שור',BM+'W_1850-1228-4'],['Wikipedia',W+'Lamassu']]},

alexander:{ext:{title:`מהטקסט של רן לוי, "אלכסנדר הגדול" (עושים היסטוריה)`,url:'https://www.ranlevi.co.il/blog/alexander-the-great',parts:[
 {t:`סיווה ו"בן אמון"`,q:'אחת התחנות החשובות במסעו של אלכסנדר במצרים',yt:['4tjs9OGIEeQ',1807],p:`אלכסנדר חוצה את המדבר למקדש האל אמון בסיווה, בתקווה שהאורקל יאשר שהוא בן מלך האלים. לפי אחת הגרסאות הכוהן בירך אותו כבן אמון-זאוס. ייתכן שזו הייתה ברכת נימוס מצרית רגילה, ואלכסנדר הבין אותה כפשוטה.`,link:`הקשר לוויטרינה: לכן אלכסנדר מופיע על מטבעות היורשים עם קרני האיל של אמון.`},
 {t:`שתי השאלות לאורקל`,q:'אלכסנדר המשיך ושאל את האורקל שתי שאלות',p:`אלכסנדר שואל אם רוצחי אביו נענשו ואם ישלוט בעולם. התשובות מתפרשות כאישור שהוא בן האל, ושיכבוש הכול.`},
 {t:`החשש בצבא`,q:'קל להבין מדוע לביקור בסיווה הייתה השפעה עמוקה על אלכסנדר',p:`אלכסנדר יוצא משוכנע שהוא חצי-אל. יועציו חוששים ממגלומניה, והשמועה על הייחוס האלוהי מעוררת התנגדות בקרב החיילים.`},

game:{rules:{intro:`לפי השחזור של אירווינג פינקל, אוצר במוזיאון, מלוח בבלי בכתב יתדות מ-177 לפנה"ס. הלוח המקורי מתאר גרסת הימורים, והפרטים עדיין במחלוקת.`,steps:[`שני שחקנים, לכל אחד 7 כלים. המטרה: להכניס את כל הכלים ללוח, להעביר אותם במסלול ולהוציא אותם ראשון.`,`המסלול: כל שחקן נכנס ב-4 המשבצות שבצד שלו, עובר לשורה האמצעית המשותפת (8 משבצות), ומסיים ב-2 משבצות בצד שלו.`,`קוביות: 4 קוביות בצורת פירמידה, לכל אחת 2 קודקודים מסומנים. מספר הקודקודים המסומנים שפונים למעלה (0 עד 4) הוא מספר הצעדים.`,`בכל תור מזיזים כלי אחד בדיוק לפי התוצאה. אי אפשר לנחות על כלי שלך.`,`נחיתה על כלי של היריב בשורה המשותפת מחזירה אותו אל מחוץ ללוח, והוא צריך להתחיל מחדש.`,`רוזטה (5 משבצות מסומנות בפרח): מי שנוחת עליה מקבל תור נוסף. כלי שעומד על הרוזטה האמצעית מוגן ואי אפשר להכות אותו.`,`כדי להוציא כלי מהלוח צריך תוצאה מדויקת. מי שמוציא ראשון את כל 7 הכלים מנצח.`]},t:`המשחק המלכותי של אור`,sub:[`ויטרינה 16`,`כ-2500 לפנה"ס`],p:`לוח משחק שחוקיו שוחזרו מלוח בכתב יתדות מאוחר.`,l:[['BM',BM+'W_1928-1009-378']]},

דת קשורה בדם ובהאדרה עצמית."}, {"tm": "", "txt": "צד המלחמה: המלך לבוש לבדו גלימה ארוכה ואוחז חנית גדולה. השבויים מוצגים עירומים כדי להשפיל אותם, והמנצחים והמובסים דומים – כנראה מלחמה בין שכנים קרובים."}, {"tm": "", "txt": "ברצועה התחתונה של צד המלחמה יש מהתיאורים הקדומים ביותר של מרכבות קרב. החמורים שמושכים אותן עוברים מהליכה לדהרה בהדרגה – טכניקה שלדברי מקגרגור לא שופרה עד המצאת הקולנוע."}, {"tm": "", "txt": "רוב ממצאי אור הגיעו למוזיאון עיראק בבגדד, והם קשורים לזהות הלאומית העיראקית. ביזת המוזיאון במלחמה האחרונה נחוותה שם כפגיעה קשה; אל-גילאני מתארת את ההיסטוריה העתיקה כגורם שמאחד את עיראק."}]}, {"key": "flood", "chk": "100 Objects #16", "src": "תמלול BBC", "points": [{"tm": "", "txt": "לוח המבול נכתב בצפון עיראק בין 700 ל-600 לפני הספירה. זהו שבר של לוח חרס חום כהה בגובה 13–15 ס\"מ, מכוסה כתב צפוף בשני טורים – מרחוק הוא נראה כמו טור מודעות קטנות בעיתון ישן."}, {"tm": "", "txt": "הלוח שמור כיום בספריית לוחות החרס של המוזיאון, על מדפים מהרצפה עד התקרה, ובכל מגש עד תריסר לוחות – רובם שברים. הוא הגיע מנינוה."}, {"tm": "", "txt": "ג'ורג' סמית', שוליה בבית דפוס סמוך שבא למוזיאון בהפסקות הצהריים, לימד את עצמו לקרוא כתב יתדות. ב-1872 זיהה על הלוח סיפור על אדם שאלוהיו מצווה עליו לבנות סירה ולהעלות אליה את משפחתו ובעלי חיים, לפני מבול שיחסל את האנושות."}, {"tm": "", "txt": "התרגום שמובא בפרק: להרוס את הבית ולבנות סירה, לוותר על הרכוש ולהציל חיים, להעלות זרע של כל היצורים. לסירה אורך ורוחב שווים ויש לה גג – הקבלה ברורה לציווי על נח בבראשית."}, {"tm": "", "txt": "לפי עדות בת הזמן, כשסמית' קרא את השורות שהמשמר חשף, הכריז שהוא הראשון שקורא אותן אחרי אלפיים שנות שכחה, קפץ ורץ בחדר בהתרגשות – ולתדהמת הנוכחים התחיל להתפשט."}, {"tm": "", "txt": "הלוח נכתב במאה ה-7 לפני הספירה – כ-400 שנה לפני הנוסח העתיק ביותר ששרד של סיפור המבול במקרא. מכאן השאלה שהסעירה את התקופה: האם סיפור נח הוא חלק ממאגר אגדות משותף לכל המזרח הקרוב?"}, {"tm": "", "txt": "סמית' פרסם את הלוח 12 שנים בלבד אחרי \"מוצא המינים\" של דרווין. פרופ' דייוויד דמרוש מקולומביה מספר שראש הממשלה גלדסטון בא לשמוע את ההרצאה, ב ושוב בכל המתחם."}, {"tm": "", "txt": "הפסל אנטוני גורמלי (\"מלאך הצפון\") מתפעל מהליטוש: פני השטח נוצרו בשיוף בחול בלבד, על גרניט – מהחומרים הקשים ביותר. לדבריו זו חגיגה של מה שעם שלם מסוגל לעשות יחד."}, {"tm": "", "txt": "הגרניט נחצב באסואן כגוש אחד, עוצב בגסות, נגרר על מזחלות עץ אל רפסודה ושט במורד הנילוס ללוקסור. העיבוד העדין נעשה במקום. מקגרגור משווה את המבצע לבניית כביש מהיר יותר מאשר ליצירת אמנות."}, {"tm": "", "txt": "האגיפטולוגית קארן אקסל מסבירה שנראות הייתה מרכזית למלוכה. דוגמה ל\"ספין\": קרב קדש מול החיתים בשנה החמישית למלכותו הסתיים בתיקו, אך תואר בשבעה מקדשים כניצחון שרעמסס השיג לבדו."}, {"tm": "", "txt": "מה לחפש: חור בגודל כדור טניס בפלג הגוף, מעל השד הימני. המומחים מייחסים אותו לניסיון של אנשי נפוליאון להוציא את הפסל ב-1798, ניסיון שנכשל; עד 1799 הפסל כבר היה שבור."}, {"tm": "", "txt": "ב-1816 הוציא את פלג הגוף ג'ובאני בטיסטה בלצוני, איש חזק מקרקס שהפך לסוחר עתיקות. מאות פועלים גררו אותו על גלילי עץ אל הנילוס – כמעט באותה שיטה שבה הובא לשם במקור – ומשם הוא נשלח לקהיר, לאלכסנדריה וללונדון."}, {"tm": "", "txt": "בלונדון הפסל עורר תדהמה, והיה מהיצירות הראשונות שערערו על ההנחה שהאמנות הגדולה התחילה ביוון."}, {"tm": "", "txt": "האירוניה לדברי מקגרגור: רעמסס רצה מורשת של גדולה נצחית, אבל שלי ידע מה עלה בגורל מצרים אחריו, והפך את הפסל לסמל של חלוף העוצמה ושל ההבל שבהישגי אדם."}]}, {"key": "lachish", "chk": "100 Objects #21", "src": "תמלול BBC", "points": [{"tm": "", "txt": "תבליטי לכיש נעשו בסביבות 700 לפני הספירה ונמצאו בצפון עיראק. מקגרגור עומד בחדר שקירותיו מכוסים כולם בגילופי אבן בגובה כ-2.5 מ', המספרים את המצור על לכיש ביהודה בשנת 701 לפני הספירה."}, {"tm": "", "txt": "הוא משווה אותם ל\"סרט באבן\": קודם הצבא הפולש צועד, אחר כך הקרב סביב העיר הנצורה, אחר כך ההרוגים, הפצועים וטורי הפליטים, ולבסוף המלך סנחריב יושב בניצחונו."}, {"tm": "", "txt": "לכיש היא תל א-דוויר, כ-40 ק\"מ דרומית-מערבית לירושלים – עיר גבעה מבוצרת והשנייה בחשיבותה בממלכת יהודה. היא שלטה בדרכי המסחר שחיברו את מסופוטמיה לים התיכון ולמצרים."}, {"tm": "", "txt": "חזקיהו מלך יהודה מרד באשו אי תבל. לדברי מקגרגור, \"תקן הזהב\" מתחיל כאן."}, {"tm": "", "txt": "קרויסוס שאל את האורקל בדלפי על המלחמה עם פרס, ונענה שאימפריה גדולה תיפול. האימפריה שנפלה הייתה שלו: כורש הפרסי שבה אותו – ומינה אותו ליועץ."}, {"tm": "", "txt": "הפרסים אימצו את השיטה הלודית, הפיצו את מטבעות קרויסוס בדרכי המסחר, ובהמשך טבעו מטבעות זהב וכסף טהורים משלהם במטבעה של סרדיס. כך הפרק מתחבר לאימפריה הפרסית ולכורש."}]}, {"key": "oxus", "chk": "100 Objects #26", "src": "תמלול BBC", "points": [{"tm": "", "txt": "דגם המרכבה מאוצר אמו-דריה (Oxus) עשוי זהב ונעשה לפני כמעט 2,500 שנה באימפריה הפרסית. מרכבה מזהב מלא רתומה לארבעה סוסי זהב, ונכנסת בנוחות בכף היד."}, {"tm": "", "txt": "מה רואים: שתי דמויות – רכב שעומד ואוחז במושכות, ונוסע גדול ממנו שיושב על ספסל לצדו. כנראה זהו פקיד בכיר שמבקר בפרובינציה שהוא שולט בה בשם מלך פרס."}, {"tm": "", "txt": "המרכבה נמצאה בקצה המזרחי של האימפריה, איפשהו בגבול טג'יקיסטן ואפגניסטן, כחלק מאוצר ענק של חפצי זהב וכסף. האוצר הוא אחד האוספים הגדולים של המוזיאון כבר יותר ממאה שנה."}, {"tm": "", "txt": "ייתכן שזה צעצוע לילד מיוחס, וייתכן שזו מנחה לאלים – בקשה או תודה. מקגרגור מדגיש שאי אפשר לדעת בוודאות."}, {"tm": "", "txt": "כורש כינה את עצמו \"מלך המלכים\": האימפריה הייתה מעין קונפדרציה של ממלכות, כל אחת עם שליט משלה תחת פיקוח פרסי. ההיסטוריון טום הולנד מסביר שמי ששילם מסים ולא מרד הושאר לנפשו, אבל מי שקם נגד המלך הושמד."}, {"tm": "", "txt": "הנוסע הוא כנראה סטרפ (מושל) בסיור. שימו לב למעיל המעוטר והיקר ולכיסוי הראש שמעיד על סמכות. הגלגלים הגדולים, בעלי החישורים, גבוהים כמו הסוסים ונועדו לנסיעות ארוכות."}, {"tm": "", "txt": "פרס הייתה האימפריה הגדולה הראשונה שנשענה על דרכים. היו בה תחנות דרך ושירות דואר מלכותי של רוכבים ורצים. הרודוטוס כתב ששום דבר בעולם אינו נע מהר יותר מהשליחים הפרסיים, ושלג, גשם וחושך אינם עוצרים אותם."}, {"tm": "", "txt": "ריבוי התרבויות בחפץ אחד: לפי טכניקת עיבוד המתכת הוא נעשה במרכז פרס, הדמויות לבושות כמדים, ובחזית המרכבה בולט ראש האל המצרי בס – גמד עקום רגליים, מגן ילדים ונקלעים לצרה."}, {"tm": "", "txt": "מקגרגור משווה את בס לקמע שתלוי היום על מראת המכונית. הוא רואה בזה הדגמה לסובלנות הדתית של האימפריה, שלפעמים אף אימצה אלים של עמים כבושים."}, {"tm": "", "txt": "הקשר המקראי: כשכבש כורש את בבל ב-539 לפני הספירה, הוא הוציא הצהרה בבבלית שבה הציג את עצמו כמגן העם הכבוש. היהודים, שהוגלו בידי נבוכדנצר, קיבלו רשות לשוב לירושלים ולבנות מחדש את המקדש."}, {"tm": "", "txt": "במקרא, ובעיקר אצל ישעיהו, כורש מתואר כגיבור ששליחותו מאלוהים. ב-1917, כשממשלת בריטניה הכריזה על בית לאומי ליהודים בפלשתינה, הוצגו במזרח אירופה תמונות של כורש לצד תמונות המלך ג'ורג' החמישי."}, {"tm": "", "txt": "הפרסים עצמם כתבו מעט על ניהול האימפריה, ורוב המידע מגיע ממקורות יווניים עוינים. מייקל אקסוורת'י מאוניברסיטת אקסטר מתאר תרבות איראנית שמרגישה בנוח עם מורכבות, וגאווה עמוקה בעבר האימפריאלי."}]}, {"key": "alexander", "chk": "100 Objects #31", "src": "תמלול BBC", "points": [{"tm": "", "txt": "מטבע כסף עם דיוקן אלכסנדר מוקדון נטבע בין 305 ל-281 לפני הספירה במערב טורקיה. זהו מהמטבעות הקדומים ביותר שידועים עם דמות של מנהיג, בקוטר כ-3.8 ס\"מ."}, {"tm": "", "txt": "מה רואים: פרופיל של גבר צעיר – אף ישר, לסת חזקה, מבט חד אל המרחק, והטיית ראש שמשדרת תנועה קדימה. אי אפשר לדעת אם זה דיוקן נאמן."}, {"tm": "", "txt": "שימו לב לקרני האיל שבשערו: הן מזהות אותו כאלכסנדר. הקרניים קשורות לזאוס-אמון, שילוב של האל היווני והאל המצרי. כך המטבע מצהיר על שלטונו גם ביוונים וגם במצרים, ורומז שהוא אדם ואל גם יחד."}, {"tm": "", "txt": "אלכסנדר, בנו של פיליפוס השני ממוקדון ותלמידו של אריסטו, עלה לשלטון ב-336 לפני הספירה בגיל 20. במשך עשר שנות מערכות הביס את כל האימפריה הפרסית, אז הגדולה בעולם."}, {"tm": "", "txt": "רובין ליין פוקס, המומחה המוביל לאלכסנדר, מסביר שהניעו אותו אידיאלים הרואיים של מלך מוקדוני, הרצון להגיע לקצה העולם – ואנשיו עצרו אותו בהודו – והרצון להאפיל על אביו."}, {"tm": "", "txt": "את המערכות מימנו מכרות הזהב והכסף של תרקיה שכבש פיליפוס, ואחר כך כמעט חמישה מיליון קילו זהב פרסי שנלקחו כשלל."}, {"tm": "", "txt": "במצרים, באורקל של אמון, הוכרז אלכסנדר לא רק כפרעה חוקי אלא כאל, \"בן זאוס-אמון\" – ומכאן הקרניים. לדברי ליין פוקס, הוא האמין שהוא בנו של זאוס במובן מסוים וקיבל כבוד של אל, אבל ידע שהוא בן תמותה."}, {"tm": "", "txt": "דמותו האחידה והמאודרת נוצרה רק אחרי מותו ב-323 לפני הספירה. ליין פוקס מציין שהדיוקן מבוסס על אבני חן שאלכסנדר עצמו הזמין, והוא שלט באמנים שהורשו לעצב את דמותו."}, {"tm": "", "txt": "הפכו את המטבע: בצד השני מופיעה אתנה נושאת הניצחון עם חנית ומגן, והאותיות היווניות מגלות שזה מטבע של המלך ליסימכוס – אחד מגנרליו של אלכסנדר, ששלט בתרקיה עד מותו ב-281 לפני הספירה."}, {"tm": "", "txt": "למה לא דיוקן של עצמו? ליסימכוס ניכס לעצמו את התהילה והסמכות של קודמו. מקגרגור מכנה זאת \"כמעט גניבת זהות\". כל היורשים טענו שהם ממשיכי אלכסנדר, והמאבק התנהל גם על המטבעות."}, {"tm": "", "txt": "מקגרגור משווה זאת לדיוקן מאו על השטרות הסיניים ולוושינגטון על הדולר. הפרשן אנדרו מאר מזכיר את נפוליאון ואת הדיקטטורים, ומוסיף שככל שתרבות פוליטית דמוקרטית וויכוחית יותר, קשה יותר לנכס מנהיג מת – למשל צ'רצ'יל."}, {"tm": "", "txt": "התוצאה: ליסימכוס לא זכה באימפריה, אבל זכה בממלכה והחזיק בה. במשך 300 השנים הבאות שלטו במזרח התיכון מלכים ושושלות דוברי יוונית – ומהם מגיעה גם אבן הרוזטה."}]}, {"key": "rosetta", "chk": "100 Objects #33", "src": "תמלול BBC", "points": [{"tm": "", "txt": "אבן הרוזטה הוצבה ב-196 לפני הספירה ונמצאה באל-רשיד (רוזטה) שבמצרים. יחד עם המומיות היא החפץ הפופולרי ביותר במוזיאון, ומדריכים בכל שפה מצטופפים סביבה מדי יום."}, {"tm": "", "txt": "מה רואים: אבן אפורה בגודל מזוודה גדולה. הקצוות המחוספסים מראים שנשברה מאבן גדולה יותר, והשברים חוצים את הכתובת. הסופרת אהדאף סואייף תוהה למה חרתו הצהרה על פטור ממס על אבן ששוקלת 760 ק\"ג."}, {"tm": "", "txt": "הרקע: תלמי החמישי, מלך-ילד יווני שעלה לכס ב-205 לפני הספירה בגיל שש, כיתום. אמו נרצחה, חיילים הסתערו על הארמון, ומרידות ברחבי מצרים דחו את הכתרתו בשנים."}, {"tm": "", "txt": "התלמיים צאצאי אחד מגנרליו של אלכסנדר. הם לא טרחו ללמוד מצרית, והפכו את היוונית לשפת המנהל לאלף שנה. הם גם הפכו את אלכסנדריה לכרך המזהיר של העולם היווני, עם הספרייה הגדולה והמגדלור."}, {"tm": "", "txt": "האבן איננה ייחודית: ידועות עוד 17 כתובות דומות, כולן בשלוש שפות ומהללות את התלמיים, שהוצבו במקדשים גדולים ברחבי מצרים."}, {"tm": "", "txt": "הצו הוצא בידי כוהני מצרים ביום השנה הראשון להכתרה בממפיס. הוא מכריז על תלמי כאל חי, אבל בתמורה מקבלים הכוהנים הקלות מס. פרופ' דורותי תומפסון מקיימברידג' מציינת חידוש: הכוהנים כבר לא נדרשו לבוא כל שנה לאלכסנדריה, ויכלו להתכנס בממפיס."}, {"tm": "", "txt": "לדברי מקגרגור, האבן היא ביטוי של כוח וגם של פשרה. התוכן ביורוקרטי ויבש כמו אמנה של האיחוד האירופי, אבל מה שחשוב הוא שאותו טקסט נכתב שלוש פעמים."}, {"tm": "", "txt": "שלוש מערכות הכתב: יוונית – שפת השליטים והמנהל; דמוטית – הכתב המצרי היומיומי; והירוגליפים – כתב הכוהנים. בזמן הצו רק הכוהנים הבינו הירוגליפים, וכעבור 500 שנה הידיעה הזאת אבדה לגמרי."}, {"tm": "", "txt": "דרך האבן: כנראה הוצבה לראשונה במקדש בסאיס שבדלתא, ובשלב כלשהו הועברה לרוזטה, כ-65 ק\"מ משם. ב-1798 חיילי נפוליאון שבנו מחדש ביצורים חשפו אותה, והמלומדים שליוו את הצבא הבינו מיד את חשיבותה."}, {"tm": "", "txt": "הצרפתים לקחו אותה כשלל, אבל אחרי תבוסתם נכללה האבן ברשימת העתיקות שנמסרו לבריטים בהסכם אלכסנדריה ב-1801."}, {"tm": "", "txt": "מה לחפש: על הצד השבור יש בעצם \"שפה רביעית\" – כיתוב באנגלית בשבלונה, שלפיו האבן נלכדה בידי הצבא הבריטי ב-1801 והוענקה בידי המלך ג'ורג' השלישי. סואייף מעירה שאיש לא שקל שהיא אינה שייכת לאף אחת משתי המעצמות."}, {"tm": "", "txt": "הפענוח: הפיזיקאי האנגלי תומאס יאנג זיהה שקבוצת סימנים שחוזרת על עצמה היא השם \"תלמי\". הצרפתי ז'אן-פרנסואה שמפוליון הבין שכל ההירוגליפים הם גם ציוריים וגם פונטיים, ועד 1822 פיצח את הכתב כולו."}, {"tm": "", "txt": "מה לחפש: בשורה האחרונה של הטקסט ההירוגליפי, שלושה סימנים מאייתים את המילה המצרית ל\"לוח אבן\", וסימן רביעי מצייר לוח מרובע עם ראש מעוגל – כך נראתה האבן במקור. הצליל והתמונה עובדים יחד."}]}, {"key": "roman", "chk": "100 Objects #35", "src": "תמלול BBC", "points": [{"tm": "", "txt": "ראש אוגוסטוס עשוי ברונזה, נעשה לפני כאלפיים שנה ונמצא במרואה שבצפון סודן. הוא מעט גדול מגודל טבעי, ונשבר בצוואר מפסל באורך מלא שהציג את הקיסר כלוחם."}, {"tm": "", "txt": "מה לחפש: העיניים דרמטיות וחודרות, אבל מכל נקודה שעומדים הן לא מביטות בכם אלא מעבר לכם – אל עתידו. הראש נטוי כמו בשיחה, והשיער הקצר והפרוע עוצב בקפידה כדי לשדר נעורים וסמכות."}, {"tm": "", "txt": "אוגוסטוס היה אחיין-נכדו של יוליוס קיסר, ונעשה יורשו בגיל 19 אחרי הרצח ב-44 לפני הספירה. נקודת המפנה הייתה ניצחונו על אנטוניוס וקליאופטרה באקטיום ב-31 לפני הספירה, ואחריה כיבוש מצרים העשירה."}, {"tm": "", "txt": "ב-27 לפני הספירה העניק לו הסנאט את התואר \"אוגוסטוס\" – הנערץ – והמעמד החדש דרש דיוקן חדש. הראש במוזיאון נעשה שנה-שנתיים אחרי שהפך לקיסר. מקגרגור מזכיר שבאימפריה שלו נולד ישו."}, {"tm": "", "txt": "ההיסטוריונית סוזן ווקר מסבירה שאוגוסטוס לא יכול היה להעתיק את הדיוקן של קיסר – זקן, רזה וקירח ברוח הפורטרט הרומי המסורתי – ובחר דמות צעירה. הוא אימץ אותה בשנות השלושים שלו ולא שינה אותה עד מותו בגיל 76."}, {"tm": "", "txt": "לדברי ווקר שרדו יותר מ-250 דיוקנאות של אוגוסטוס מכל רחבי האימפריה, וכמעט כולם זהים. מעולם לא הייתה לו \"עיתונות רעה\"."}, {"tm": "", "txt": "בוריס ג'ונסון, חוקר קלאסיקה ופוליטיקאי, מכנה אותו הפוליטיקאי הגדול ביותר בהיסטוריה. לדבריו, דמותו הייתה הדבק של האימפריה: נשים תפרו את דיוקנו על כיסויי הראש, ומי שרצה קריירה פוליטית מקומית נעשה כוהן בפולחן אוגוסטוס."}, {"tm": "", "txt": "התעמולה כללה ערים שנקראו על שמו – סרגוסה, אוגסבורג, אוטן ואאוסטה – דיוקנו על מטבעות ופסלים בכל מקום. הוא סלל דרכים, הקים מערך שליחים והנהיג את \"השלום הרומי\"."}, {"tm": "", "txt": "הצד האפל: הפסל עמד בגבול הדרומי של האימפריה, כנראה בסיינה ליד אסואן. לפי סטרבון, ב-25 לפני הספירה פלש צבא ממלכת מרואה בהנהגת המלכה קנדקה, בעלת העין האחת, וכבש מבצרים וערים רומיים בדרום מצרים."}, {"tm": "", "txt": "קנדקה לקחה את הפסל למרואה וקברה את הראש הכרות מתחת למדרגות מקדש שהוקדש לניצחון, כך שכל מי שעלה למקדש דרך על הקיסר. מה לחפש: גרגרי חול מהמדבר האפריקני עדיין תקועים במשטח הברונזה."}, {"tm": "", "txt": "קנדקה שלחה שגרירים לשיחות שלום, ואוגוסטוס נתן להם כמעט כל מה שביקשו. מכונת התעמולה הרומית מחקה את הכישלון מהתמונה הרשמית."}, {"tm": "", "txt": "אחרי מותו הכריז הסנאט שאוגוסטוס הוא אל. כל הקיסרים שבאו אחריו אימצו את התארים \"אוגוסטוס\" ו\"קיסר\", והחודש סקסטיליס שונה לאוגוסט. ג'ונסון מונה בין מחקיו את הצארים, הקייזר, נפוליאון, מוסוליני והיטלר."}]}, {"key": "roman", "chk": "100 Objects #36", "src": "תמלול BBC", "points": [{"tm": "", "txt": "גביע וורן הוא גביע כסף רומי מהשנים 5–15 לספירה, מבתיר שליד ירושלים. על דפנותיו מתוארים יחסי מין בין גברים בוגרים לנערים מתבגרים. מקגרגור פותח את הפרק מול \"הנשיקה\" של רודן, שהוזמנה גם היא בידי אדוארד וורן ונדחתה בעיירה לואיס ובבוסטון כפורנוגרפית."}, {"tm": "", "txt": "מה רואים: גביע יין גדול בצורת גביע ספורט קטן, על בסיס נמוך שעומד היום מעט עקום. פעם היו לו שתי ידיות, ושתיהן אבדו. הסצנות בולטות ונוצרו בהקשה על הכסף מבפנים החוצה."}, {"tm": "", "txt": "ההקשר: משתה של גברים בלבד בווילה מפוארת ליד ירושלים בסביבות שנת 10. האורחים הסבו על ספות, והגביע עבר מיד ליד. בסצנות עצמן יש ספות עם אריגים, נבל וחלילים."}, {"tm": "", "txt": "ההיסטוריונית בטני יוז מתארת את שני הצדדים: בצד אחד גבר מבוגר עם זקן ונער – תיאור ריאליסטי מאוד. בצד השני שני צעירים יפים, תיאור לירי ואידיאלי יותר. היא רואה בגביע אחד החפצים היפים במוזיאון."}, {"tm": "", "txt": "ברומא הומוסקסואליות הייתה נסבלת אך לא מקובלת לגמרי. מקגרגור מצטט את פלאוטוס: אפשר לאהוב את מי שרוצים, כל עוד מתרחקים מנשים נשואות, אלמנות, בתולות, צעירים ונערים בני חורין."}, {"tm": "", "txt": "לכן הסצנות ממוקמות ביוון הקלאסית, שבה היה מקובל שגבר מבוגר מדריך נער בן חורין. פרופ' ג'יימס דייווידסון מסביר שציירי הכדים היוונים דווקא נמנעו מסצנות כאלה, והרומאים מציגים מה שלא הוצג חמש מאות שנה קודם. העולם היווני שימש \"אליבי\" שהופך את התמונה לאמנות."}, {"tm": "", "txt": "מה לחפש: התסרוקת של הנערים, עם קווצת שיער ארוכה על העורף, אופיינית לנערים יוונים בני חורין – השיער נגזז והוקדש לאלים בגיל 16–18. ומאחור, עבד מציץ מבעד לדלת, ורואים רק חצי מפניו."}, {"tm": "", "txt": "גביעי כסף מהתקופה נדירים מאוד, כי רובם הותכו. גביע כזה עלה כ-250 דינר – המחיר של 25 כדי יין משובח, שני שלישים של אקר אדמה, או עבד לא מיומן כמו זה שמציץ בדלת."}, {"tm": "", "txt": "מקגרגור מציב את הגביע בעולם החברה הגבוהה שפאולוס השליח גינה בשל שכרות וזנות."}, {"tm": "", "txt": "החיבור לארץ: הגביע כנראה נמצא קבור בבתיר, כמה קילומטרים דרומית-מערבית לירושלים. ההשערה: בעליו קבר אותו כשנמלט מהלחימה בשנת 66, כשהיהודים מרדו וכבשו את העיר בכוח."}, {"tm": "", "txt": "הגביע נעלם לכמעט אלפיים שנה, עד שאדוארד וורן קנה אותו ברומא ב-1911. אחרי מותו ב-1928 איש לא רצה לקנות אותו: המוזיאון הבריטי ומוזיאון פיצוויליאם סירבו, ופקיד מכס אף מנע את כניסתו לארצות הברית."}, {"tm": "", "txt": "רק ב-1999 קנה אותו המוזיאון הבריטי – הרכישה היקרה ביותר שלו עד אז. לדברי מקגרגור, הגביע מזכיר שהיחס של חברות ליחסים מיניים לעולם אינו קבוע."}]}, {"key": "hinton", "chk": "100 Objects #44", "src": "תמלול BBC", "points": [{"tm": "", "txt": "פסיפס הינטון סנט מרי נעשה במאה ה-4 לספירה ברצפה של וילה רומית בדורסט שבאנגליה. במרכזו דיוקן כתפיים בגודל טבעי בערך: גבר מגולח עם שיער בהיר מסורק לאחור, בטוניקה וגלימה הדוקה סביב הכתפיים."}, {"tm": "", "txt": "מה לחפש: מאחורי הראש מופיעות האותיות היווניות כי ורו – שתי האותיות הראשונות של \"כריסטוס\". זהו ישו, באחד הדימויים הקדומים ביותר שלו, ונעשה ברצפת וילה בדורסט בסביבות שנת 350 – לא בכנסייה במזרח או ברומא."}, {"tm": "", "txt": "במאות הראשונות של הנצרות לא העזו לצייר את פני האל: לא היה תיאור של מראהו, והמסורת היהודית אסרה לייצג את האל באמנות. לפי מקגרגור, ההחלטה לתאר את ישו נבעה כנראה מכך שהאליטה הרומית התרגלה לראות את אליה בפסלים ובפסיפסים."}, {"tm": "", "txt": "בבריטניה של התקופה התערבבו פגאניות ונצרות בלי קושי. מקגרגור מצביע על אוצר מילדנהול בוויטרינות הסמוכות: צלחת כסף עם בכחוס השיכור, ולצדה כפות עם סמלים נוצריים."}, {"tm": "", "txt": "החומרים מקומיים – אבנים שחורות, אדומות וצהבהבות מדורסט, משובצות במלט. בכניסה לחדר היה עיגול עם הגיבור בלרופון רוכב על פגסוס ומביס את הכימרה; בקצה השני, בכיוון ההפוך, עיגול עם ישו – במקום שבו היו מצפים לאורפאוס או לבכחוס."}, {"tm": "", "txt": "ההיסטוריון איימון דאפי מסביר שהזוג לא מוזר כמו שנדמה: הנצרות ניכסה את המיתוס הפגאני כדי לבטא תחייה ונצחון החיים על המוות, וכך המוות על הצלב מוצג כמו גיבור ששוחט מפלצת. בהמשך תפסו את מקומו גיבורים כמו גאורגיוס הקדוש והדרקון."}, {"tm": "", "txt": "מה מחזיק ישו? לא את הצלב, שנחשב אז כלי השפלה. האמן נתן לו מונוגרמה במקום סמל – הכי-רו – שמונחת כמו הילה. זה הסמל שאימץ הקיסר קונסטנטינוס אחרי שהתנצר ב-313."}, {"tm": "", "txt": "תסרוקת ישו ובלרופון תואמת לאופנה של סביבות 350, כ-40 שנה אחרי ההתנצרות. פרופ' אברל קמרון מאוקספורד מסבירה שקונסטנטינוס הפך את הנצרות לחוקית, נתן לכוהניה הקלות מס ובנה כנסיות. זה מה שאיפשר לבעל הווילה להציג את אמונתו בגלוי."}, {"tm": "", "txt": "מה לחפש: משני צדי הראש רימונים, שמזכירים את פרספונה, שחזרה מהשאול – משל למוות ולתחייה. כך האמן קושר את ישו לאורפאוס ולבכחוס, אלים שגם הם קשורים לשיבה מהמתים."}, {"tm": "", "txt": "שתי עמדות: קמרון רואה בפסיפס ניסוי לתאר את ישו בצורה מוכרת, ומתרשמת מהעיניים החודרות. דאפי מוצא אותו מרוחק ולא מושך, עם סנטר מסיבי, ומעריך שאיש לא יבחר בו כדיוקן האהוב עליו."}, {"tm": "", "txt": "תפקיד החדר אינו ידוע. הוא פנה צפונה ולא היה בו חימום תת-רצפתי, כך שכנראה לא היה חדר אוכל. ישו פונה מזרחה ויש מקום למזבח בינו לבין הקיר, ולכן ייתכן שהחדר היה כנסיית בית מוקדמת."}, {"tm": "", "txt": "ב-427 אסר הקיסר לתאר את ישו ברצפות פסיפס והורה להסיר את הקיימים. אבל אז בריטניה כבר לא הייתה חלק מהאימפריה והווילה כנראה ננטשה, ולכן הרצפה שרדה."}]}, {"key": "flood", "chk": "Lex Fridman", "src": "תמלול Lex Fridman", "points": [{"tm": "1:11:13", "txt": "פרידמן שואל את ארווינג פינקל, אוצר במוזיאון הבריטי, על \"לוח התיבה\" שפענח: לוח חרס בבלי מסביבות 1700 לפני הספירה, עם סיפור מבול שקדם לסיפור נח לפחות באלף שנה."}, {"tm": "1:11:50", "txt": "איך הגיע הלוח: מבקרים נהגו להביא חפצים למומחה התורן במוזיאון. אדם אחד הביא אוסף שלם, ופינקל זיהה כמעט מיד שהלוח שבו הוא חלק מסיפור המבול. גודלו כ-20 על 8 ס\"מ."}, {"tm": "1:12:40", "txt": "העלילה בלוח: האלים מחליטים להשמיד את בני האדם כי הם רועשים ולא נותנים להם לישון. אחד משלושת האלים הבכירים מתנגד, ומזהיר את אתרחסיס לבנות סירה. בכ-60 השורות של הלוח מופיעים צורת הסירה, החומרים והכמויות – כמו שרטוט הנדסי."}, {"tm": "1:13:29", "txt": "ההפתעה: הסירה עגולה – קורקל ענק, כמו סירות הנהר העגולות של מסופוטמיה, שאינן טובעות. בעלי החיים זכר ונקבה, אשת אתרחסיס ושלושת בניו עולים אליה. הדבר שונה מתיבת נח, שבדמיון הכללי יש לה צורת ארון."}, {"tm": "1:14:23", "txt": "פינקל מזכיר את ג'ורג' סמית', שב-1872 מצא בלוח מספריית נינוה קטע מקביל באפוס גלגמש. שם הגיבור אוטנפישתים שולח ציפור שלוש פעמים אחרי שהתיבה נחה על הר, והשלישית אינה חוזרת – בדיוק כמו בספר בראשית."}, {"tm": "1:15:40", "txt": "מסקנתו: זו תלות ספרותית, לא שני סיפורים נפרדים. נוסח נינוה והמקרא קרובים בזמן (המאה ה-7–6 לפני הספירה), אבל לוח מ-1700 לפני הספירה מוכיח שהסיפור המסופוטמי קדם. הוא מוסיף שבירושלים אין שיטפונות, ואילו במסופוטמיה הם היו מציאות."}, {"tm": "1:16:31", "txt": "לדעתו, הסיפור נולד מאסון אמיתי – אולי צונאמי או שיטפון ענק שסחף את המישורים אל המפרץ הפרסי – אבל לא מבול עולמי. הזיכרון עבר מסבא לנכד, והיה לבבלים אף קשת בענן כסימן שהמבול לא יחזור."}, {"tm": "1:18:12", "txt": "הקשר המקראי לפי פינקל: אחרי חורבן המקדש, גולי יהודה חיו בבבל שלושה דורות. כדי שלא ייטמעו, כתבו מנהיגיהם \"אמנה\" של תולדותיהם, ושאלו רעיונות בבליים על בריאה ומבול. אצל הבבלים הסיבה היא רעש; במקרא – חטא."}, {"tm": "1:21:46", "txt": "האם התיבה נבנתה באמת? פינקל משיב שלא – זו יצירה ספרותית ומוסרית שנשענת על כך שניצולים אמיתיים היו בסירות. סיפורי מבול בתרבויות אחרות הם לעתים תוצאה של מיסיונרים, ולעתים רעיון שקם באופן עצמאי."}, {"tm": "1:23:42", "txt": "במסופוטמיה דיברו על \"לפני המבול\" ו\"אחרי המבול\" כקו פרשת מים בהיסטוריה. ברשימת מלכים עתיקה מופיעים אפילו מלכים מלפני המבול, שמלכו אלפי שנים."}, {"tm": "1:25:13", "txt": "לרעיון של גרהם הנקוק על אסון עולמי לפני כ-12 אלף שנה פינקל נותן הסתברות \"זניחה\". לדבריו, הסיפור המסופוטמי נולד משיטפון מקומי ולא מאירוע שנגע באמריקה או בסין."}, {"tm": "1:26:51", "txt": "השחזור: שלושה מומחים לבניית סירות ערביות מימי הביניים בנו בקרלה שבהודו קורקל בשליש מהגודל לפי הוראות הלוח – צלעות עץ, קליעה וציפוי ביטומן. ביטומן עיראקי לא ניתן היה לייצא, ובגלל הביטומן ההודי הסירה דלפה מעט; פינקל טוען שזה רק אותנטי."}, {"tm": "1:29:37", "txt": "לדבריו, היחסים בין כמויות החומרים בלוח מדויקים: הם לקוחים מבניית קורקל רגיל ומוגדלים. הוא מסביר זאת במסורת שבעל-פה – מספר שמספר לאנשי נהר שבונים קורקלים חייב לתת מספרים אמינים, אחרת לא יאמינו לו."}, {"tm": "1:31:45", "txt": "\"הרעש\" הוא לדעתו לשון נקייה לעודף אוכלוסין: לפני המבול לא היה מוות. בסוף לוחות אחרים יוצרים האלים נשים עקרות וקבוצות שאינן מתרבות – עמדה \"מלתוסיאנית\" מתוחכמת."}]}, {"key": "game", "chk": "Lex Fridman", "src": "תמלול Lex Fridman", "points": [{"tm": "1:32:50", "txt": "פרידמן שואל את ארווינג פינקל מה הוא המשחק המלכותי של אור ואיך הצליח לפענח את חוקיו."}, {"tm": "1:33:05", "txt": "זהו לוח של 20 משבצות בצורה ייחודית. הוא היה כמעט לא ידוע עד שנות ה-20, כשסר ליאונרד וולי מצא בקברי בית המלוכה השומרי באור ארבעה או חמישה לוחות כאלה, עם קוביות וכלים. מכאן שהמשחק היה פופולרי, ושהם רצו לשחק בו גם בעולם הבא."}, {"tm": "1:34:07", "txt": "הלוח מאור מתוארך לכ-2600 לפני הספירה. לוחות דומים נמצאו במצרים, בסוריה, בלבנון, בירדן, בטורקיה, ביוון ובכרתים, עד סוף האלף הראשון לפני הספירה – כמעט 3,000 שנה. פינקל משווה אותו לשחמט ולשש-בש, משחקים שכבשו את העולם."}, {"tm": "1:35:38", "txt": "גם בקבר תות-ענח-אמון נמצאו שניים-שלושה לוחות עם כלים. פינקל מדגיש שהמשחק התפשט בלי חוקים כתובים ובלי שפה משותפת – סוחר ראה אנשים משחקים בבית מרזח, ניסה, וחזר הביתה עם הרעיון."}, {"tm": "1:36:29", "txt": "מבנה הלוח: גוש של 4×3, \"גשר\" של שתי משבצות וגוש 3×2 בקצה. אחרי 2000 לפני הספירה הועברו המשבצות מהקצה לשדרה המרכזית, וכל הלוחות המאוחרים בנויים כך: 12 משבצות באמצע וארבע בכל צד בקצה אחד."}, {"tm": "1:37:22", "txt": "זהו משחק מירוץ: מכניסים כלים זהים בפינה, עולים בשדרה האמצעית ויוצאים בקצה. משבצות עם רוזטה הן כנראה משבצות בטוחות או משבצות שמזכות בזריקה נוספת, ואפשר לנסות לחסום את היריב."}, {"tm": "1:38:08", "txt": "לדעתו, הסוד של המשחק הוא האיזון בין מזל לאסטרטגיה: לא מזל בלבד כמו סולמות וחבלים, ולא אסטרטגיה בלבד כמו שחמט. המקבילה המודרנית הקרובה היא השש-בש."}, {"tm": "1:39:03", "txt": "המפתח לפענוח: לוח חרס במוזיאון הבריטי מהמאה ה-2 לפני הספירה – 2,300 שנה אחרי לוח אור – ובו שמות הכלים ופרטים על הזריקות. מתוכו שחזר פינקל לאחור משחק שעובד."}, {"tm": "1:39:54", "txt": "החוקים שלו התקבלו, ומשחקים בהם בכל העולם, באינטרנט ואפילו בבתי קפה בעיראק. המשחק הוגן ומהיר, כך שאפשר לשחק \"הטוב משלוש\"."}, {"tm": "1:40:32", "txt": "אנקדוטה: אחרי הרצאה במוזיאון גטי בקליפורניה הוצבו שולחנות עם עותקים של המשחק. אחרי כמה דקות צעק מישהו \"אני שונא אותך!\" – הזעם הבריא שכל משחק לוח טוב מעורר."}, {"tm": "1:41:59", "txt": "למה בני אדם משחקים? פינקל מזכיר את המושג ההודי \"טיים פאס\" – מה עושים כשחם מכדי לעשות משהו אחר. לדבריו, המשחק מעביר יריבות לזירה בטוחה."}, {"tm": "1:43:52", "txt": "על הימורים: בלוח של בית ספר מסופוטמי מצוטטת שורה שבה אדם מקונן על עצם הקרסול שלו (אסטרגל, ששימש כקובייה). פינקל רואה בה שריד ל\"קינת המהמר\", כנראה על מי שהפסיד הכול."}, {"tm": "1:44:48", "txt": "פרט מלוח החוקים: התנועות והזכיות מתוארות במונחים של אוכל, שתייה ונשים – כלומר החוקים נוסחו כאילו המשחק מתנהל בבית מרזח."}]}, {"key": "game", "chk": "British Museum", "src": "כתוביות YouTube", "points": [{"tm": "0:00", "txt": "ארווינג פינקל מציג משחק לוח בן 4,500 שנה לפחות, ששיחקו בו במזרח התיכון השומרים, שכנראה גם המציאו אותו. לדבריו, הראיות שנמצאו מאפשרות לדעת איך שיחקו בו – ולשחק בו היום בהתלהבות רבה."}, {"tm": "0:30", "txt": "טום סקוט, יוצר סרטונים על מדע וטכנולוגיה, משמש \"נציג הקהל\" שמעולם לא שיחק במשחק. פינקל מבטיח בהומור לשחק בעדינות בהתחלה, אבל לנצח – כי הוא זה שגילה את החוקים, והוא עובד במוזיאון."}, {"tm": "1:31", "txt": "הלוח שעליו הם משחקים הוא העתק. המקור נעשה בסביבות 2500 לפני הספירה ונמצא עם כלים וקוביות, אבל במשך זמן רב איש לא ידע את החוקים, ואנשים פשוט המציאו כללים."}, {"tm": "2:01", "txt": "המפתח: לוח חרס בכתב יתדות מהמאה ה-2 לפני הספירה, שכתב אסטרונום בבלי שחבריו הקרובים היו אסטרונומים יוונים. פינקל מכנה אותו ספר החוקים העתיק בעולם."}, {"tm": "2:31", "txt": "הלוח מתאר גרסה מאוחרת ומסובכת מאוד, ולכן מתחילים בגרסה בסיסית. לדברי פינקל, הלוח הסביר חוקים חדשים למשחק שכולם כבר הכירו – עם הימורים על משקה ועל נשים – ולכן אינו מפרט את המסלול."}, {"tm": "3:02", "txt": "את המסלול משחזרים בהיגיון: כל מי ששיחק בלודו יבין שזה חייב להיות משחק מירוץ. לכל שחקן שבעה כלים; נכנסים בצד שלך, פונים בפינה, עוברים בשדרה האמצעית ויוצאים בקצה."}, {"tm": "3:32", "txt": "המטרה: להכניס את כל הכלים ללוח, להעביר אותם במסלול ולהוציא אותם לפני היריב. בשדרה המשותפת \"נמצאים במלחמה\": מי שנוחת על כלי של היריב מחזיר אותו להתחלה."}, {"tm": "4:04", "txt": "מה לחפש על הלוח: המשבצות עם הרוזטה מזכות בזריקה נוספת, ומשבצת הרוזטה המרכזית בטוחה – כלי שעומד עליה אי אפשר להפיל, והיריב מדלג מעליה."}, {"tm": "4:36", "txt": "הקוביות אינן פירמידות אלא ארבעונים – בסיסן משולש. בשתיים מארבע הפינות יש נקודה לבנה, וזורקים ארבע קוביות יחד. מספר הנקודות הלבנות שלמעלה הוא התוצאה, ואם אין אף אחת – מפסידים את התור."}, {"tm": "5:08", "txt": "פינקל מסביר שלפני השחמט והשש-בש כולם שיחקו במשחק הזה, והוא החזיק מעמד 3,000 שנה – ולכן כנראה היה משחק טוב. ההוכחה בעיניו: אף פעם לא יודעים מי ינצח עד הרגע האחרון."}, {"tm": "5:38", "txt": "לדבריו, למתחיל אין חיסרון מול מי שמשחק כבר 47 שנה, כי הכול תלוי בזריקה. אחר כך מתחיל המשחק עצמו, וסקוט מנסה לחשב את ההסתברות לכל תוצאה."}]}, {"key": "game", "chk": "Curator's Corner", "src": "כתוביות YouTube", "points": [{"tm": "0:01", "txt": "ארווינג פינקל מספר שהחליט כבר בגיל תשע שהוא רוצה להיות אוצר דווקא במוזיאון הבריטי – והגשים את זה."}, {"tm": "0:31", "txt": "המחלקה שלו מחזיקה כ-130 אלף לוחות כתב יתדות שנחפרו בעיראק, רובם במאה ה-19. הם מכסים 3,000 שנה, מראשית הכתב ועד המאה הראשונה לספירה, ופינקל מספר שעבר על כולם לפחות שלוש פעמים."}, {"tm": "1:52", "txt": "אחד הלוחות האהובים עליו נכתב במאה ה-2 לפני הספירה – מאוחר מאוד במונחים בבליים – ומסביר איך משחקים במשחק הלוח הלאומי של מסופוטמיה. פינקל מצא אותו אחרי כשנתיים בעבודה."}, {"tm": "2:02", "txt": "הקושי: היו בידיו חוקים בלי לדעת לאיזה לוח הם שייכים. הוא ניסה אותם על כל המשחקים העתיקים הידועים ממצרים וממסופוטמיה, ורק על \"משחק 20 המשבצות\" הם התאימו בדיוק."}, {"tm": "2:33", "txt": "על העתק מדויק הוא מדגים את המסלול: שחקן אחד נכנס מפינה, יורד בשולי הלוח, עולה בשדרה האמצעית ויוצא בכיוון השני, והיריב עושה מסלול מקביל מהצד השני."}, {"tm": "3:05", "txt": "מה לחפש בוויטרינה: הלוח המקורי מסביבות 2500 לפני הספירה, ולידו כלים עגולים – שחורים ללבנים – לשני השחקנים, ושני סוגי קוביות. לצדם מוצג לוח החוקים, חסר ושבור מעט."}, {"tm": "3:3 ": "דניאל ה': בלשאצר, שהספר מציג כבנו של נבוכדנצר, עורך משתה גדול ומצווה להביא את כלי המקדש שנלקחו מירושלים. הוא, שריו ופילגשיו שותים בהם יין ומשבחים את אלילי הזהב, הכסף, הנחושת, העץ והברזל."}, {"tm": "34:14", "txt": "יד מסתורית כותבת מילים על הקיר ונעלמת – ומכאן הביטוי \"הכתובת על הקיר\". חכמי המלך לא מצליחים לפרש אותה, וקוראים לדניאל, שנואם על חולשת אלי בבל וגדולת אלוהי ישראל."}, {"tm": "35:12", "txt": "הכתובת: \"מנא מנא תקל ופרסין\". לפי הספר, מנא – אלוהים מנה את מלכותך והשלים אותה (המילה כפולה כדי לוודא את הספירה); תקל – נשקלת במאזניים ונמצאת חסר; פרסין – מלכותך נחצתה ונמסרה למדי ופרס."}, {"tm": "36:00", "txt": "שחר ענבר מוסיף מבט ביקורתי: לפי הסיפור אלה מילות כישוף, ויש עוד שלוש גרסאות לכתובת מלבד נוסח המסורה – תרגום השבעים, התרגום היווני המיוחס לתאודוטיון ותרגום יווני נוסף – ובכל אחת סדר המילים משתנה."}, {"tm": "36:40", "txt": "כל מילה היא גם פועל וגם משקל של כסף: מנה (50 או 60 שקל), שקל, ופרס (חצי שקל). אולי מילות הלחש מתארות ערך כסף שהולך ויורד ומביא לנפילת ממלכה, ומשחק המילים בין \"פרס\" המטבע לפרס האימפריה הכניס אותן לסיפור הזה."}, {"tm": "37:35", "txt": "בתרגום השבעים מופיע תקציר של הסיפור שאין בנוסחים אחרים. ההשערה: סיפורים עצמאיים הסתובבו בגרסאות שונות ושולבו במהדורות שונות של הספר, שאורכן שונה מאוד."}, {"tm": "38:32", "txt": "באותו לילה בלשאצר מת ובבל נופלת. אבל הספר אומר שהמלך שבא אחריו הוא דריוש, בעוד שמהמקרא עצמו וממקורות יווניים ידוע שהמלך הפרסי הראשון היה כורש."}, {"tm": "38:59", "txt": "ועוד בעיה: לפי שחר, בלשאצר לא היה בנו של נבוכדנצר אלא בנו של נבונאיד, הוא מעולם לא היה מלך ולא היה קשור לנבוכדנצר – וזה ידוע בוודאות."}, {"tm": "39:19", "txt": "המגיש תוהה איך דניאל, שישב בחצר המלך, לא מכיר את המלכים. שחר עונה שהמחבר מכיר היטב את מלחמות הדיאדוכים, אבל פחות את מה שקרה בתקופה הבבלית – עוד סימן לכך שהספר נכתב מאוחר."}, {"tm": "40:05", "txt": "בפרק ו' דריוש ממנה את דניאל ליועץ בכיר; השרים מקנאים בו ומשיגים צו שאוסר להתפלל לאיש מלבד המלך 30 יום. דניאל ממשיך להתפלל לכיוון ירושלים, נזרק לגוב האריות ויוצא בשלום."}, {"tm": "41:45", "txt": "ההסבר: בזמן כתיב /* London time & gallery status (official map 03/2026: rooms 7, 9, 10, 19, 20, 57, 58 open 11:00–15:00) */
function london(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {wd:p.weekday,min:(+p.hour)*60+(+p.minute),hm:p.hour+':'+p.minute,md:p.month+'-'+p.day};
}
function museumOpen(L){const close=L.wd==='Fri'?20*60+30:17*60;return L.min>=600&&L.min<close}
function status(id){
  const s=STOPS[id],L=london();
  if(!museumOpen(L)) return null;
  if(s.closed&&L.wd==='Fri'&&L.min>=17*60) return {cls:'bad',t:'סגור בערב שישי'};
  if(s.limit){
    if(L.min<660) return {cls:'bad',t:'נפתח ב-11:00'};
    if(L.min>=900) return {cls:'bad',t:'נסגר ב-15:00'};
    const left=900-L.min;
    return {cls:left<=45?'bad':'ok',t:left<=45?`עוד ${left} דק' לסגירה`:'פתוח עד 15:00'};
  }
  if(L.wd==='Fri'&&L.min>=17*60&&(s.floor===0&&['r7','r9','r10','r6'].includes(id))) return {cls:'bad',t:'סגור בערב שישי'};
  return null;
}
function limitChip(id){const s=STOPS[id];return s.limit?`<span class="chip info">חדר ${s.limit.join(', ')}: <span class="ltr">11:00–15:00</span></span>`:''}

function renderClock(){
  const L=london();
  $('#clock').textContent=`לונדון ${L.hm}${museumOpen(L)?'':' · המוזיאון סגור'}`;
  const a=[];
  if(museumOpen(L)&&L.min<900){
    const ns=route().find(([id])=>STOPS[id].limit&&!stopDone(id));
    if(ns&&L.min>=780) a.push(`חדרי אשור והלבנט (7, 9, 10, 57, 58) נסגרים ב-15:00. נשארו ${900-L.min} דקות.`);
  }
  if(L.wd==='Fri') a.push('יום שישי: בערב סגורים חדרים 25, 68–73, 90–90a, 92–94, וחדרי אשור והלבנט לא פתוחים.');
  $('#alert').innerHTML=a.map(t=>`<div class="alert glass">${I.warn}<span>${esc(t)}</span></div>`).join('');
}

function renderMap(){

  const real=mapMode==='real';
  let h='';
  if(real){
    const [vx,vy,vw,vh]=P.vb.split(' ');
    h+=`<image class="realmap" href="maps/${floor?'upper':'ground'}.png" x="${vx}" y="${vy}" width="${vw}" height="${vh}" preserveAspectRatio="none"/>`;
  } else {
  if(P.court) h+=`<rect x="${P.court[0]}" y="${P.court[1]}" width="${P.court[2]}" height="${P.court[3]}" rx="22" fill="var(--court)" stroke="var(--line)"/>`;
  h+=`<circle cx="${P.circle[0]}" cy="${P.circle[1]}" r="${P.circle[2]}" fill="var(--court)" stroke="var(--line)" stroke-width="1.5"/>`;

  if(P.pizza) h+=`<rect x="${P.pizza[0]}" y="${P.pizza[1]}" width="${P.pizza[2]}" height="${P.pizza[3]}" rx="10" fill="var(--room-ctx)"/>`;
  P.ctx.forEach(([n,x,y,w,hh])=>{h+=`<rect class="room-ctx" x="${x}" y="${y}" width="${w}" height="${hh}" rx="6"/>`;if(hh>=22)h+=`<text class="rnum" x="${x+w/2}" y="${y+hh/2}" style="opacity:.6">${n}</text>`});
  }
  Object.entries(P.rooms).forEach(([n,[x,y,w,hh]])=>{
    const id=roomOwner[n], inRoute=id&&routeIdx(id)>=0;
    const st=id&&STOPS[id];
    const cls=['room-stop'];if(real)cls.push('ov');
    if(id&&stopDone(id))cls.push('done');
    if(st&&(st.limit||[]).includes(n))cls.push('closed');
    h+=`<rect class="${cls.join(' ')}" data-stop="${id}" x="${x}" y="${y}" width="${w}" height="${hh}" rx="6" ${inRoute?'':'style="opacity:.45"'}><title>חדר ${n}</title></rect>`;
    if(!real) h+=`<text class="rnum" x="${x+w/2}" y="${hh>=60?y+hh/2+8:y+hh/2+6}" style="fill:var(--ink)">${n}</text>`;
  });
  if(!real) P.labels.forEach(([x,y,t])=>h+=`<text class="rlab" x="${x}" y="${y}">${t}</text>`);
  // route path + pins
  const pts=[];
  r.forEach(([id],i)=>{const s=STOPS[id];if(s.floor!==floor)return;const rr=P.rooms[s.rooms[0]];const c=pinPos(rr);pts.push({id,i,c})});
  for(let k=1;k<pts.length;k++) if(pts[k].i===pts[k-1].i+1) h+=`<line class="route" x1="${pts[k-1].c[0]}" y1="${pts[k-1].c[1]}" x2="${pts[k].c[0]}" y2="${pts[k].c[1]}"/>`;
  pts.forEach(({id,i,c})=>{const cl=['pin'];if(stopDone(id))cl.push('done');else if(id===nx)cl.push('next');
    h+=`<g class="${cl.join(' ')}" data-stop="${id}"><circle cx="${c[0]}" cy="${c[1]}" r="14"/><text x="${c[0]}" y="${c[1]}">${i+1}</text></g>`});
  svg.innerHTML=h;
}
function pinPos([x,y,w,h]){return h>=60?[x+w/2,y+20]:[x+w/2,y+2]}

function linkHtml([label,url],pri){return `<a class="lk${pri?' pri':''}" href="${esc(url)}" target="_blank" rel="noopener"><span dir="auto">${esc(label)}</span>${I.ext}</a>`}

function itemHtml(k){
  const it=ITEMS[k], on=seen.has(k), ps=PODS[k]||[];
  const hasInfo=!!(it.more||it.ext||it.rules);
  const pOpen=openPanels.has(k+':pods'), iOpen=openPanels.has(k+':info');
  const info=hasInfo?[
    it.more?`<div class="h4">תקציר בעברית</div><ul class="plain">${it.more.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="src">מקור: ${esc(it.msrc)}</div>`:'',
    it.ext?`<div class="h4">${esc(it.ext.title)}</div><ol class="ext">${it.ext.parts.map(x=>`<li><b>${esc(x.t)}.</b> ${esc(x.p)}${x.link?` <i>${esc(x.link)}</i>`:''}<div class="links" style="margin-top:4px"><a class="lk" href="${esc(it.ext.url+frag(x.q))}" target="_blank" rel="noopener">${I.doc}לקטע בטקסט</a>${x.yt?`<a class="lk pri" href="https://www.youtube.com/watch?v=${x.yt[0]}&t=${x.yt[1]}s" target="_blank" rel="noopener">${I.play}YouTube · מ-${fmt(x.yt[1])}</a>`:''}</div></li>`).join('')}</ol>`:'',
    it.rules?`<div class="h4">חוקי המשחק</div><p class="small">${esc(it.rules.intro)}</p><ol class="plain">${it.rules.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''
  ].join(''):'';
  return `<article class="item${on?' seen':''}">
    <div class="hd">
      <button class="check" role="checkbox" aria-checked="${on}" data-item="${k}" aria-label="ראיתי: ${esc(it.t)}"><span>${I.check}</span></button>
      <div class="t"><h3>${esc(it.t)}</h3>
        <div class="sub">${it.sub.map(x=>`<span dir="auto">${esc(x)}</span>`).join('<span>·</span>')}${it.star?`<span class="chip star">Don't miss · ${it.star}</span>`:''}${it.warn?'<span class="chip bad">⚠ מיקום לא אומת</span>':''}${it.off?'<span class="chip bad">לא מוצג כרגע</span>':''}</div></div>
    </div>

    <p>${esc(it.p)}</p>

    <div class="links">${it.l.map(l=>linkHtml(l)).join('')}${ps.length?`<button class="lk tg${pOpen?' on':''}" data-panel="${k}:pods" aria-expanded="${pOpen}">${I.head}האזנה ותמלולים (${ps.length})</button>`:''}${hasInfo?`<button class="lk tg${iOpen?' on':''}" data-panel="${k}:info" aria-expanded="${iOpen}">${I.doc}מידע נוסף</button>`:''}</div>
    ${ps.length?`<div class="panel pods" ${pOpen?'':'hidden'} data-for="${k}:pods">${ps.map(podHtml).join('')}</div>`:''}
    ${hasInfo?`<div class="panel info" ${iOpen?'':'hidden'} data-for="${k}:info">${info}</div>`:''}
  </article>`;
}
/* Spotify: a search for the episode (opens the Spotify app); skipped for videos and when a direct Spotify link exists */
const SHOW_FULL={'100 Objects':'A History of the World in 100 Objects'};
function spotifyUrl(p){
  if(p.sp) return p.t?`${p.sp}?t=${p.t}`:p.sp;
  if(p.listen.some(([,u])=>/youtube\.com|ted\.com|spotify\.com/.test(u))) return null;
  const clean=x=>x.replace(/#[\d–-]+/g,'').replace(/\([^)]*\)/g,'').replace(/⚠️?/g,'').trim();
  const show=clean(p.show); const q=`${SHOW_FULL[show]||show} ${clean(p.ep)}`.replace(/\s+/g,' ');
  return 'https://open.spotify.com/search/'+encodeURIComponent(q);
}
/* Hebrew transcript: Google Translate of the English transcript page */
const heUrl=u=>'https://translate.google.com/translate?sl=en&tl=iw&u='+encodeURIComponent(u);
const fmt=t=>{const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=String(t%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
const frag=q=>'#:~:text='+encodeURIComponent(q).replace(/-/g,'%2D');
const ytSec=(l,p)=>/youtube\.com\/watch/.test(l[1])?(l[2]!=null?l[2]:(p.ytT!=null?p.ytT:null)):null;
function podHtml(p){
  const sp=(prefs.spotify||!shownListen(p).length)?spotifyUrl(p):null, heTr=p.tr&&p.l==='EN'?heUrl(p.tr[1]):null;
  return `<div class="pod">
    <div class="hd"><span class="lang">${p.l}</span><div class="ttl"><bdi>${esc(p.show)}</bdi> · <span class="ep"><bdi>${esc(p.ep)}</bdi></span></div></div>
    <div class="m">${p.len?`<span>⏱ <span dir="auto">${esc(p.len)}</span></span>`:''}${p.at?`<span class="chip star">מאיפה: ${esc(p.at)}</span>`:''}</div>
    ${p.cue?`<div class="bible"><b>להקשיב למשפט:</b> ${esc(p.cue)}</div>`:''}
    <p>${esc(p.sum)}</p>
    ${p.elab?`<details class="more"><summary>תקציר מורחב</summary><ul class="elab">${p.elab.map(x=>x.hdr?`<li class="hdr"><b>${esc(x.hdr)}</b></li>`:`<li>${x.tm?(x.vid&&x.sec!=null?`<a class="tm" href="https://www.youtube.com/watch?v=${esc(x.vid)}&t=${x.sec}s" target="_blank" rel="noopener">${esc(x.tm)}</a> `:`<span class="tm">${esc(x.tm)}</span> `):''}${esc(x.txt)}</li>`).join('')}</ul><div class="src">מקור: ${esc(p.esrc||'')}</div></details>`:(p.more&&p.more.length?`<details class="more"><summary>תקציר מורחב</summary><ul>${p.more.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${p.src?`<div class="src">מקור התקציר: ${esc(p.src)}</div>`:''}</details>`:'')}
    <div class="links">${shownListen(p).map(l=>{const sec=ytSec(l,p);return `<a class="lk pri${/youtube/.test(l[1])?' yt':''}" href="${esc(sec?`${l[1]}&t=${sec}s`:l[1])}" target="_blank" rel="noopener">${I.play}<span dir="auto">${esc(l[0])}${sec?` · מ-${fmt(sec)}`:''}</span></a>`}).join('')}${sp?`<a class="lk pri" href="${esc(sp)}" target="_blank" rel="noopener">${I.play}<span>Spotify${p.t?` · מ-${fmt(p.t)}`:''}</span></a>`:''}${p.tr?`<a class="lk" href="${esc(p.tr[1]+(p.trq?frag(p.trq):''))}" target="_blank" rel="noopener">${I.doc}תמלול ${esc(p.tr[0])}${p.trq?' · לקטע':''}</a>`:''}${heTr?`<a class="lk" href="${esc(heTr)}" target="_blank" rel="noopener">${I.doc}תמלול בעברית</a>`:''}</div>
  </div>`;
}

/* ---------- sheet open/close via hash (Android back button closes it) ---------- */
function openFromHash(){
  const h=location.hash.slice(1);
  const sheet=$('#sheet');
  if(h==='info'||h==='prefs'||STOPS[h]){
    openId=h;
    if(h==='info')renderInfo();else if(h==='prefs')renderPrefs();else{renderSheet(h);if(STOPS[h].floor!==floor)setFloor(STOPS[h].floor)}
    sheet.hidden=false;requestAnimationFrame(()=>{if(openId!==h)return;sheet.classList.add('on');$('#scrim').classList.add('on')});
    $('#shBody').scrollTop=0;
    $('#shClose').focus({preventScroll:true});
  }else if(openId){
    openId=null;sheet.classList.remove('on');$('#scrim').classList.remove('on');
    setTimeout(()=>{if(!openId)sheet.hidden=true},380);
  }
}
const go=id=>{location.hash=id};
const close=()=>{if(location.hash){history.length>1&&openId?location.hash='':location.hash='';}};

function setFloor(f){floor=f;$('#fl-0').setAttribute('aria-pressed',f===0);$('#fl-1').setAttribute('aria-pressed',f===1);renderMap()}
function setRoute(k){routeKey=k;LS.set('bm-route',k);$('#rt-full').setAttribute('aria-pressed',k==='full');$('#rt-short').setAttribute('aria-pressed',k==='short');renderAll()}
function renderAll(){renderClock();renderMap();renderList();if(STOPS[openId])renderSheet(openId)}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-item]');
  if(c){const k=c.dataset.item;seen.has(k)?seen.delete(k):seen.add(k);LS.set('bm-seen',[...seen]);
    const sc=$('#shBody').scrollTop;renderAll();$('#shBody').scrollTop=sc;return}
  const tg=e.target.closest('[data-panel]');
  if(tg){const id=tg.dataset.panel, open=!openPanels.has(id);open?openPanels.add(id):openPanels.delete(id);tg.setAttribute('aria-expanded',open);tg.classList.toggle('on',open);const pn=document.querySelector(`[data-for="${id}"]`);if(pn)pn.hidden=!open;return}
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return}
  if(e.target.closest('[data-close]')){close();return}
  const s=e.target.closest('[data-stop]'); if(s&&s.dataset.stop){go(s.dataset.stop);return}
});
